name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Unpack and build
        run: |
          Z=$(find . -iname '*.zip' | head -n1)
          [ -n "$Z" ] || { echo "No zip found:"; ls -R | head -50; exit 1; }
          unzip -q "$Z" -d proj
          cd "$(dirname "$(find proj -name gradlew | head -n1)")"
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app-debug.apk
